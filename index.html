<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preload primary variable font -->
    <link rel="preload" href="/fonts/Estedad-VF.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

    <title>SEA BREW | نوشیدنی قهوه‌ای از ساحل جنوب</title>
    <meta name="description" content="وبسایت رسمی برند SEA BREW — نوشیدنی قهوه‌ای آماده‌مصرف از بوشهر، جنوب ایران. تجربه ساحلی، مدرن و سینمایی با الهام از دریای گرم خلیج فارس." />
    
    <!-- Theme color -->
    <meta name="theme-color" content="#FFFADE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Facebook / Telegram / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:title" content="SEA BREW | نوشیدنی قهوه‌ای از ساحل جنوب" />
    <meta property="og:description" content="وبسایت رسمی برند SEA BREW — نوشیدنی قهوه‌ای آماده‌مصرف از بوشهر، جنوب ایران." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://seabrew.ir/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SEA BREW | نوشیدنی قهوه‌ای از ساحل جنوب" />
    <meta name="twitter:description" content="وبسایت رسمی برند SEA BREW — نوشیدنی قهوه‌ای آماده‌مصرف از بوشهر، جنوب ایران." />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- JSON-LD Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SEA BREW",
      "alternateName": "سی برو",
      "url": "https://seabrew.ir/",
      "description": "نوشیدنی قهوه‌ای آماده‌مصرف از بوشهر، جنوب ایران."
    }
    /* LocalBusiness فقط پس از رسیدن آدرس و تلفن رسمی فعال شود:
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "SEA BREW",
      "address": { "@type": "PostalAddress", "addressLocality": "بوشهر" }
    }
    */
    </script>
  </head>
  <body class="bg-[#FFFADE] text-[#161617] font-['Estedad'] selection:bg-[#A78040] selection:text-[#FFFADE]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
